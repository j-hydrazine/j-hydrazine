<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Falling blocks activity</title>
  <desc id="desc">A minimal blue and dark falling-block animation that fills a GitHub-style grid before restarting.</desc>

  <defs>
    <style>
      .dark { fill: #242432; }
      .blue { fill: #275b9f; }
      .pale { fill: #eef2f6; }
      .line { stroke: #d7dde5; stroke-width: 4; }
      @media (prefers-reduced-motion: reduce) {
        animate, animateTransform { display: none; }
      }
    </style>

    <pattern id="emptyCells" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="18" height="18" rx="3" class="pale" stroke="#d7dde5" stroke-width="1"/>
    </pattern>
    <pattern id="darkCells" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="18" height="18" rx="3" class="dark"/>
    </pattern>
    <pattern id="blueCells" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="18" height="18" rx="3" class="blue"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="#ffffff"/>
  <path d="M24 18H1176" class="line"/>
  <path d="M24 238H1176" class="line"/>

  <g transform="translate(228 44)">
    <rect x="0" y="0" width="744" height="168" fill="url(#emptyCells)" opacity="0.52"/>

    <g id="stack">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.9;0.94;0.98;1" dur="14s" repeatCount="indefinite"/>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;0.94" dur="14s" repeatCount="indefinite"/>
        <rect x="0" y="144" width="744" height="24" fill="url(#darkCells)"/>
        <rect x="216" y="144" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="504" y="144" width="72" height="24" fill="url(#blueCells)"/>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.22;0.23;0.9;0.94" dur="14s" repeatCount="indefinite"/>
        <rect x="0" y="120" width="720" height="24" fill="url(#darkCells)"/>
        <rect x="24" y="120" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="336" y="120" width="120" height="24" fill="url(#blueCells)"/>
        <rect x="648" y="120" width="72" height="24" fill="url(#blueCells)"/>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.35;0.9;0.94" dur="14s" repeatCount="indefinite"/>
        <rect x="24" y="96" width="696" height="24" fill="url(#darkCells)"/>
        <rect x="144" y="96" width="120" height="24" fill="url(#blueCells)"/>
        <rect x="432" y="96" width="96" height="24" fill="url(#blueCells)"/>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.47;0.9;0.94" dur="14s" repeatCount="indefinite"/>
        <rect x="0" y="72" width="648" height="24" fill="url(#darkCells)"/>
        <rect x="48" y="72" width="72" height="24" fill="url(#blueCells)"/>
        <rect x="264" y="72" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="552" y="72" width="96" height="24" fill="url(#blueCells)"/>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.59;0.9;0.94" dur="14s" repeatCount="indefinite"/>
        <rect x="48" y="48" width="600" height="24" fill="url(#darkCells)"/>
        <rect x="168" y="48" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="384" y="48" width="72" height="24" fill="url(#blueCells)"/>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.71;0.9;0.94" dur="14s" repeatCount="indefinite"/>
        <rect x="96" y="24" width="528" height="24" fill="url(#darkCells)"/>
        <rect x="240" y="24" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="504" y="24" width="72" height="24" fill="url(#blueCells)"/>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.82;0.83;0.9;0.94" dur="14s" repeatCount="indefinite"/>
        <rect x="168" y="0" width="384" height="24" fill="url(#darkCells)"/>
        <rect x="312" y="0" width="72" height="24" fill="url(#blueCells)"/>
      </g>
    </g>

    <g id="falling-pieces">
      <g transform="translate(72 -56)">
        <animateTransform attributeName="transform" type="translate" values="72 -56;72 120;72 120;72 -56" keyTimes="0;0.09;0.1;1" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.09;0.1;1" dur="14s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="18" height="18" rx="3" class="dark"/><rect x="24" y="0" width="18" height="18" rx="3" class="dark"/><rect x="48" y="0" width="18" height="18" rx="3" class="dark"/><rect x="72" y="0" width="18" height="18" rx="3" class="dark"/>
      </g>

      <g transform="translate(264 -56)">
        <animateTransform attributeName="transform" type="translate" values="264 -56;264 96;264 96;264 -56" keyTimes="0;0.21;0.22;1" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.11;0.21;0.22;1" dur="14s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="18" height="18" rx="3" class="blue"/><rect x="24" y="0" width="18" height="18" rx="3" class="blue"/><rect x="48" y="0" width="18" height="18" rx="3" class="blue"/><rect x="24" y="24" width="18" height="18" rx="3" class="blue"/>
      </g>

      <g transform="translate(456 -56)">
        <animateTransform attributeName="transform" type="translate" values="456 -56;456 96;456 96;456 -56" keyTimes="0;0.33;0.34;1" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.23;0.33;0.34;1" dur="14s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="18" height="18" rx="3" class="dark"/><rect x="24" y="0" width="18" height="18" rx="3" class="dark"/><rect x="0" y="24" width="18" height="18" rx="3" class="dark"/><rect x="24" y="24" width="18" height="18" rx="3" class="dark"/>
      </g>

      <g transform="translate(96 -56)">
        <animateTransform attributeName="transform" type="translate" values="96 -56;96 48;96 48;96 -56" keyTimes="0;0.45;0.46;1" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.35;0.45;0.46;1" dur="14s" repeatCount="indefinite"/>
        <rect x="0" y="24" width="18" height="18" rx="3" class="blue"/><rect x="24" y="24" width="18" height="18" rx="3" class="blue"/><rect x="48" y="24" width="18" height="18" rx="3" class="blue"/><rect x="48" y="0" width="18" height="18" rx="3" class="blue"/>
      </g>

      <g transform="translate(624 -56)">
        <animateTransform attributeName="transform" type="translate" values="624 -56;624 48;624 48;624 -56" keyTimes="0;0.57;0.58;1" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.47;0.57;0.58;1" dur="14s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="18" height="18" rx="3" class="dark"/><rect x="0" y="24" width="18" height="18" rx="3" class="dark"/><rect x="24" y="24" width="18" height="18" rx="3" class="dark"/><rect x="48" y="24" width="18" height="18" rx="3" class="dark"/>
      </g>

      <g transform="translate(384 -56)">
        <animateTransform attributeName="transform" type="translate" values="384 -56;384 24;384 24;384 -56" keyTimes="0;0.69;0.7;1" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.59;0.69;0.7;1" dur="14s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="18" height="18" rx="3" class="blue"/><rect x="24" y="0" width="18" height="18" rx="3" class="blue"/><rect x="24" y="24" width="18" height="18" rx="3" class="blue"/><rect x="48" y="24" width="18" height="18" rx="3" class="blue"/>
      </g>

      <g transform="translate(552 -56)">
        <animateTransform attributeName="transform" type="translate" values="552 -56;552 0;552 0;552 -56" keyTimes="0;0.81;0.82;1" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.71;0.81;0.82;1" dur="14s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="18" height="18" rx="3" class="dark"/><rect x="24" y="0" width="18" height="18" rx="3" class="dark"/><rect x="48" y="0" width="18" height="18" rx="3" class="dark"/><rect x="72" y="0" width="18" height="18" rx="3" class="dark"/>
      </g>
    </g>
  </g>
</svg>

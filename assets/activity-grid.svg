        <rect x="0" y="0" width="18" height="18" rx="3" class="dark"/><rect x="24" y="0" width="18" height="18" rx="3" class="dark"/><rect x="48" y="0" width="18" height="18" rx="3" class="dark"/><rect x="72" y="0" width="18" height="18" rx="3" class="dark"/>
      </g>

      <g opacity="0" transform="translate(96 -72)">
        <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.07;0.92;1" dur="24s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="96 -72;96 -72;96 120;96 120;96 120" keyTimes="0;0.07;0.2;0.92;1" dur="24s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="18" height="18" rx="3" class="blue"/><rect x="24" y="0" width="18" height="18" rx="3" class="blue"/><rect x="0" y="24" width="18" height="18" rx="3" class="blue"/><rect x="24" y="24" width="18" height="18" rx="3" class="blue"/>
      </g>


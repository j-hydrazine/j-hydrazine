<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Stacking blocks activity</title>
  <desc id="desc">A minimal Tetris-style animation where blocks fall, remain stacked from the bottom, build to seven rows, then clear and restart.</desc>

  <defs>
    <style>
      .dark { fill: #242432; }
      .blue { fill: #275b9f; }
      .pale { fill: #eef2f6; }
      .line { stroke: #d7dde5; stroke-width: 4; }
      @media (prefers-reduced-motion: reduce) {
        animate, animateTransform { display: none; }
      }
    </style>

    <pattern id="emptyCells" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="18" height="18" rx="3" class="pale" stroke="#d7dde5" stroke-width="1"/>
    </pattern>
    <pattern id="darkCells" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="18" height="18" rx="3" class="dark"/>
    </pattern>
    <pattern id="blueCells" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="18" height="18" rx="3" class="blue"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#ffffff"/>
  <path d="M24 18H1176" class="line"/>
  <path d="M24 278H1176" class="line"/>

  <g transform="translate(216 52)">
    <rect x="0" y="0" width="768" height="168" fill="url(#emptyCells)" opacity="0.76"/>

    <g id="landed-stack">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.9;0.94;0.98;1" dur="21s" repeatCount="indefinite"/>

      <g opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.13;0.9;0.94" dur="21s" repeatCount="indefinite"/>
        <rect x="0" y="144" width="768" height="24" fill="url(#darkCells)"/>
        <rect x="72" y="144" width="72" height="24" fill="url(#blueCells)"/>
        <rect x="288" y="144" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="600" y="144" width="72" height="24" fill="url(#blueCells)"/>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.26;0.9;0.94" dur="21s" repeatCount="indefinite"/>
        <rect x="0" y="120" width="768" height="24" fill="url(#darkCells)"/>
        <rect x="0" y="120" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="264" y="120" width="72" height="24" fill="url(#blueCells)"/>
        <rect x="504" y="120" width="120" height="24" fill="url(#blueCells)"/>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.37;0.38;0.9;0.94" dur="21s" repeatCount="indefinite"/>
        <rect x="24" y="96" width="720" height="24" fill="url(#darkCells)"/>
        <rect x="168" y="96" width="120" height="24" fill="url(#blueCells)"/>
        <rect x="432" y="96" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="672" y="96" width="72" height="24" fill="url(#blueCells)"/>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.49;0.5;0.9;0.94" dur="21s" repeatCount="indefinite"/>
        <rect x="0" y="72" width="744" height="24" fill="url(#darkCells)"/>
        <rect x="96" y="72" width="72" height="24" fill="url(#blueCells)"/>
        <rect x="336" y="72" width="120" height="24" fill="url(#blueCells)"/>
        <rect x="552" y="72" width="96" height="24" fill="url(#blueCells)"/>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.61;0.62;0.9;0.94" dur="21s" repeatCount="indefinite"/>
        <rect x="24" y="48" width="720" height="24" fill="url(#darkCells)"/>
        <rect x="216" y="48" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="480" y="48" width="72" height="24" fill="url(#blueCells)"/>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.73;0.74;0.9;0.94" dur="21s" repeatCount="indefinite"/>
        <rect x="72" y="24" width="648" height="24" fill="url(#darkCells)"/>
        <rect x="144" y="24" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="384" y="24" width="120" height="24" fill="url(#blueCells)"/>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.85;0.86;0.9;0.94" dur="21s" repeatCount="indefinite"/>
        <rect x="120" y="0" width="552" height="24" fill="url(#darkCells)"/>
        <rect x="288" y="0" width="120" height="24" fill="url(#blueCells)"/>
        <rect x="528" y="0" width="72" height="24" fill="url(#blueCells)"/>
      </g>
    </g>

    <g id="falling-pieces">
      <g transform="translate(72 -64)">
        <animateTransform attributeName="transform" type="translate" values="72 -64;72 144;72 144;72 -64" keyTimes="0;0.12;0.13;1" dur="21s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.12;0.13;1" dur="21s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="18" height="18" rx="3" class="blue"/><rect x="24" y="0" width="18" height="18" rx="3" class="blue"/><rect x="48" y="0" width="18" height="18" rx="3" class="blue"/><rect x="72" y="0" width="18" height="18" rx="3" class="blue"/>
      </g>

      <g transform="translate(504 -64)">
        <animateTransform attributeName="transform" type="translate" values="504 -64;504 120;504 120;504 -64" keyTimes="0;0.24;0.25;1" dur="21s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.14;0.24;0.25;1" dur="21s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="18" height="18" rx="3" class="dark"/><rect x="24" y="0" width="18" height="18" rx="3" class="dark"/><rect x="0" y="24" width="18" height="18" rx="3" class="dark"/><rect x="24" y="24" width="18" height="18" rx="3" class="dark"/>
      </g>

      <g transform="translate(168 -64)">
        <animateTransform attributeName="transform" type="translate" values="168 -64;168 96;168 96;168 -64" keyTimes="0;0.36;0.37;1" dur="21s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.26;0.36;0.37;1" dur="21s" repeatCount="indefinite"/>
        <rect x="0" y="24" width="18" height="18" rx="3" class="blue"/><rect x="24" y="24" width="18" height="18" rx="3" class="blue"/><rect x="48" y="24" width="18" height="18" rx="3" class="blue"/><rect x="24" y="0" width="18" height="18" rx="3" class="blue"/>
      </g>

      <g transform="translate(336 -64)">
        <animateTransform attributeName="transform" type="translate" values="336 -64;336 72;336 72;336 -64" keyTimes="0;0.48;0.49;1" dur="21s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.38;0.48;0.49;1" dur="21s" repeatCount="indefinite"/>
        <rect x="0" y="24" width="18" height="18" rx="3" class="dark"/><rect x="24" y="24" width="18" height="18" rx="3" class="dark"/><rect x="24" y="0" width="18" height="18" rx="3" class="dark"/><rect x="48" y="0" width="18" height="18" rx="3" class="dark"/>
      </g>

      <g transform="translate(216 -64)">
        <animateTransform attributeName="transform" type="translate" values="216 -64;216 48;216 48;216 -64" keyTimes="0;0.6;0.61;1" dur="21s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.5;0.6;0.61;1" dur="21s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="18" height="18" rx="3" class="blue"/><rect x="24" y="0" width="18" height="18" rx="3" class="blue"/><rect x="48" y="0" width="18" height="18" rx="3" class="blue"/><rect x="72" y="0" width="18" height="18" rx="3" class="blue"/>
      </g>

      <g transform="translate(384 -64)">
        <animateTransform attributeName="transform" type="translate" values="384 -64;384 24;384 24;384 -64" keyTimes="0;0.72;0.73;1" dur="21s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.62;0.72;0.73;1" dur="21s" repeatCount="indefinite"/>
        <rect x="0" y="24" width="18" height="18" rx="3" class="blue"/><rect x="24" y="24" width="18" height="18" rx="3" class="blue"/><rect x="48" y="24" width="18" height="18" rx="3" class="blue"/><rect x="24" y="0" width="18" height="18" rx="3" class="blue"/>
      </g>

      <g transform="translate(528 -64)">
        <animateTransform attributeName="transform" type="translate" values="528 -64;528 0;528 0;528 -64" keyTimes="0;0.84;0.85;1" dur="21s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.74;0.84;0.85;1" dur="21s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="18" height="18" rx="3" class="dark"/><rect x="24" y="0" width="18" height="18" rx="3" class="dark"/><rect x="48" y="0" width="18" height="18" rx="3" class="dark"/><rect x="72" y="0" width="18" height="18" rx="3" class="dark"/>
      </g>
    </g>
  </g>
</svg>

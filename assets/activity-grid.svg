<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Stacking blocks activity</title>
  <desc id="desc">A minimal Tetris-style animation where active pieces fall one at a time, stay on the board, fill seven rows, and then clear.</desc>

  <defs>
    <style>
      .dark { fill: #242432; }
      .blue { fill: #275b9f; }
      .pale { fill: #eef2f6; }
      .line { stroke: #d7dde5; stroke-width: 4; }
      @media (prefers-reduced-motion: reduce) {
        animate, animateTransform { display: none; }
      }
    </style>
    <pattern id="emptyCells" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="18" height="18" rx="3" class="pale" stroke="#d7dde5" stroke-width="1"/>
    </pattern>
    <pattern id="darkCells" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="18" height="18" rx="3" class="dark"/>
    </pattern>
    <pattern id="blueCells" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="18" height="18" rx="3" class="blue"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#ffffff"/>
  <path d="M24 18H1176" class="line"/>
  <path d="M24 278H1176" class="line"/>

  <g transform="translate(216 52)">
    <rect x="0" y="0" width="768" height="168" fill="url(#emptyCells)" opacity="0.78"/>

    <g id="landed-board">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.91;0.94;0.985;1" dur="28s" repeatCount="indefinite"/>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.11;0.12;0.91;0.94" dur="28s" repeatCount="indefinite"/>
        <rect x="0" y="144" width="768" height="24" fill="url(#darkCells)"/>
        <rect x="72" y="144" width="72" height="24" fill="url(#blueCells)"/>
        <rect x="264" y="144" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="552" y="144" width="120" height="24" fill="url(#blueCells)"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.23;0.24;0.91;0.94" dur="28s" repeatCount="indefinite"/>
        <rect x="0" y="120" width="768" height="24" fill="url(#darkCells)"/>
        <rect x="0" y="120" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="312" y="120" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="648" y="120" width="72" height="24" fill="url(#blueCells)"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.36;0.91;0.94" dur="28s" repeatCount="indefinite"/>
        <rect x="0" y="96" width="768" height="24" fill="url(#darkCells)"/>
        <rect x="144" y="96" width="120" height="24" fill="url(#blueCells)"/>
        <rect x="432" y="96" width="72" height="24" fill="url(#blueCells)"/>
        <rect x="600" y="96" width="96" height="24" fill="url(#blueCells)"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.47;0.48;0.91;0.94" dur="28s" repeatCount="indefinite"/>
        <rect x="0" y="72" width="768" height="24" fill="url(#darkCells)"/>
        <rect x="96" y="72" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="288" y="72" width="120" height="24" fill="url(#blueCells)"/>
        <rect x="504" y="72" width="96" height="24" fill="url(#blueCells)"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.59;0.6;0.91;0.94" dur="28s" repeatCount="indefinite"/>
        <rect x="0" y="48" width="768" height="24" fill="url(#darkCells)"/>
        <rect x="216" y="48" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="384" y="48" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="672" y="48" width="72" height="24" fill="url(#blueCells)"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.71;0.72;0.91;0.94" dur="28s" repeatCount="indefinite"/>
        <rect x="0" y="24" width="768" height="24" fill="url(#darkCells)"/>
        <rect x="48" y="24" width="120" height="24" fill="url(#blueCells)"/>
        <rect x="336" y="24" width="72" height="24" fill="url(#blueCells)"/>
        <rect x="528" y="24" width="96" height="24" fill="url(#blueCells)"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.83;0.84;0.91;0.94" dur="28s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="768" height="24" fill="url(#darkCells)"/>
        <rect x="168" y="0" width="120" height="24" fill="url(#blueCells)"/>
        <rect x="456" y="0" width="96" height="24" fill="url(#blueCells)"/>
        <rect x="648" y="0" width="96" height="24" fill="url(#blueCells)"/>
      </g>
    </g>

    <g id="active-falling-piece">
      <g opacity="0" transform="translate(72 -72)">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.11;0.12;1" dur="28s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="72 -72;72 144;72 144;72 144" keyTimes="0;0.11;0.12;1" dur="28s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="18" height="18" rx="3" class="blue"/><rect x="24" y="0" width="18" height="18" rx="3" class="blue"/><rect x="48" y="0" width="18" height="18" rx="3" class="blue"/><rect x="72" y="0" width="18" height="18" rx="3" class="blue"/>
      </g>

      <g opacity="0" transform="translate(312 -72)">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.13;0.23;0.24;1" dur="28s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="312 -72;312 -72;312 120;312 120;312 120" keyTimes="0;0.12;0.23;0.24;1" dur="28s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="18" height="18" rx="3" class="blue"/><rect x="24" y="0" width="18" height="18" rx="3" class="blue"/><rect x="0" y="24" width="18" height="18" rx="3" class="blue"/><rect x="24" y="24" width="18" height="18" rx="3" class="blue"/>
      </g>

      <g opacity="0" transform="translate(600 -72)">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.35;0.36;1" dur="28s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="600 -72;600 -72;600 96;600 96;600 96" keyTimes="0;0.24;0.35;0.36;1" dur="28s" repeatCount="indefinite"/>
        <rect x="0" y="24" width="18" height="18" rx="3" class="blue"/><rect x="24" y="24" width="18" height="18" rx="3" class="blue"/><rect x="48" y="24" width="18" height="18" rx="3" class="blue"/><rect x="24" y="0" width="18" height="18" rx="3" class="blue"/>
      </g>

      <g opacity="0" transform="translate(288 -72)">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.37;0.47;0.48;1" dur="28s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="288 -72;288 -72;288 72;288 72;288 72" keyTimes="0;0.36;0.47;0.48;1" dur="28s" repeatCount="indefinite"/>
        <rect x="0" y="24" width="18" height="18" rx="3" class="dark"/><rect x="24" y="24" width="18" height="18" rx="3" class="dark"/><rect x="24" y="0" width="18" height="18" rx="3" class="dark"/><rect x="48" y="0" width="18" height="18" rx="3" class="dark"/>
      </g>

      <g opacity="0" transform="translate(384 -72)">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.49;0.59;0.6;1" dur="28s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="384 -72;384 -72;384 48;384 48;384 48" keyTimes="0;0.48;0.59;0.6;1" dur="28s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="18" height="18" rx="3" class="blue"/><rect x="24" y="0" width="18" height="18" rx="3" class="blue"/><rect x="48" y="0" width="18" height="18" rx="3" class="blue"/><rect x="72" y="0" width="18" height="18" rx="3" class="blue"/>
      </g>

      <g opacity="0" transform="translate(528 -72)">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.61;0.71;0.72;1" dur="28s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="528 -72;528 -72;528 24;528 24;528 24" keyTimes="0;0.6;0.71;0.72;1" dur="28s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="18" height="18" rx="3" class="blue"/><rect x="0" y="24" width="18" height="18" rx="3" class="blue"/><rect x="24" y="24" width="18" height="18" rx="3" class="blue"/><rect x="48" y="24" width="18" height="18" rx="3" class="blue"/>
      </g>

      <g opacity="0" transform="translate(648 -72)">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.73;0.83;0.84;1" dur="28s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="648 -72;648 -72;648 0;648 0;648 0" keyTimes="0;0.72;0.83;0.84;1" dur="28s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="18" height="18" rx="3" class="blue"/><rect x="24" y="0" width="18" height="18" rx="3" class="blue"/><rect x="48" y="0" width="18" height="18" rx="3" class="blue"/><rect x="72" y="0" width="18" height="18" rx="3" class="blue"/>
      </g>
    </g>
  </g>
</svg>

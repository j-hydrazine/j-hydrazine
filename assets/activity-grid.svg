      .dark { fill: #242432; }
      .blue { fill: #275b9f; }
      .soft { fill: #d9e8f7; }
      .line { stroke: #d7dde5; stroke-width: 4; }
      @media (prefers-reduced-motion: reduce) {
        animate, animateTransform { display: none; }
      }
    </style>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>


<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated GitHub activity grid</title>
  <desc id="desc">A GitHub contribution style activity grid with animated blue highlights and a moving progress bar.</desc>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="16" height="16" rx="3" fill="#292938"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6fc8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#78bfff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#2f6fc8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#274d86"/>
      <stop offset="1" stop-color="#3c79c9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="#ffffff"/>
  <path d="M24 28H1176" stroke="#d7dde5" stroke-width="5"/>
  <text x="24" y="88" fill="#242630" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">↗ GitHub Activity</text>

  <g transform="translate(44 126)">
    <rect width="1064" height="88" fill="url(#dots)"/>

    <g opacity="0.95">
      <rect x="672" y="4" width="16" height="16" rx="3" fill="#2f6fc8"/>
      <rect x="696" y="4" width="16" height="16" rx="3" fill="#2f6fc8"/>
      <rect x="720" y="4" width="16" height="16" rx="3" fill="#2f6fc8"/>
      <rect x="744" y="4" width="16" height="16" rx="3" fill="#2f6fc8"/>
      <rect x="672" y="28" width="16" height="16" rx="3" fill="#3d84d8"/>
      <rect x="696" y="28" width="16" height="16" rx="3" fill="#3d84d8"/>
      <rect x="720" y="28" width="16" height="16" rx="3" fill="#2f6fc8"/>
      <rect x="744" y="28" width="16" height="16" rx="3" fill="#2f6fc8"/>
      <rect x="768" y="28" width="16" height="16" rx="3" fill="#3d84d8"/>
      <rect x="792" y="28" width="16" height="16" rx="3" fill="#66aef0"/>
      <rect x="816" y="28" width="16" height="16" rx="3" fill="#66aef0"/>
      <rect x="840" y="28" width="16" height="16" rx="3" fill="#66aef0"/>
      <rect x="864" y="28" width="16" height="16" rx="3" fill="#91ccff"/>
      <rect x="888" y="28" width="16" height="16" rx="3" fill="#91ccff"/>
      <rect x="912" y="28" width="16" height="16" rx="3" fill="#91ccff"/>
      <rect x="648" y="52" width="16" height="16" rx="3" fill="#2f6fc8"/>
      <rect x="672" y="52" width="16" height="16" rx="3" fill="#2f6fc8"/>
      <rect x="696" y="52" width="16" height="16" rx="3" fill="#3d84d8"/>
      <rect x="720" y="52" width="16" height="16" rx="3" fill="#3d84d8"/>
      <rect x="744" y="52" width="16" height="16" rx="3" fill="#66aef0"/>
      <rect x="768" y="52" width="16" height="16" rx="3" fill="#66aef0"/>
      <rect x="792" y="52" width="16" height="16" rx="3" fill="#2f6fc8"/>
      <rect x="816" y="52" width="16" height="16" rx="3" fill="#2f6fc8"/>
      <rect x="840" y="52" width="16" height="16" rx="3" fill="#3d84d8"/>
      <rect x="864" y="52" width="16" height="16" rx="3" fill="#3d84d8"/>
      <rect x="888" y="52" width="16" height="16" rx="3" fill="#2f6fc8"/>
      <rect x="912" y="52" width="16" height="16" rx="3" fill="#2f6fc8"/>
      <rect x="936" y="52" width="16" height="16" rx="3" fill="#2f6fc8"/>
      <rect x="960" y="52" width="16" height="16" rx="3" fill="#2f6fc8"/>
      <rect x="984" y="52" width="16" height="16" rx="3" fill="#3d84d8"/>
      <rect x="1032" y="52" width="16" height="16" rx="3" fill="#2f6fc8"/>
      <rect x="1056" y="52" width="16" height="16" rx="3" fill="#3d84d8"/>
    </g>

    <rect x="-160" y="0" width="160" height="88" fill="url(#scan)" opacity="0.85">
      <animate attributeName="x" from="-180" to="1080" dur="4.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="44" y="230" width="370" height="16" fill="url(#bar)">
    <animate attributeName="width" values="160;370;250;430;160" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>

<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">j-hydrazine profile banner</title>
  <desc id="desc">A dark blue animated technical banner with grid lines, orbit rings, and the text Hey, I'm j-hydrazine.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a111d"/>
      <stop offset="0.52" stop-color="#193153"/>
      <stop offset="1" stop-color="#4e9ae8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1082 118) rotate(90) scale(84)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#9ed4ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#4e9ae8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="120" height="80" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V80" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40" y="-40" width="80" height="80" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="240" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="240" rx="16" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="240" rx="16" fill="url(#glow)" opacity="0.7">
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="4s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0.9">
    <text x="68" y="58" fill="#8dd7ff" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="700" letter-spacing="4">J-HYDRAZINE / 03</text>
    <text x="68" y="126" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="45" font-weight="800">Hey, I'm j-hydrazine.</text>
    <text x="68" y="162" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Building AI tools, product systems, and useful little machines.</text>
    <text x="68" y="198" fill="#75ccff" font-family="Consolas, Monaco, monospace" font-size="12">ideas -&gt; systems -&gt; experiments -&gt; iteration</text>
  </g>

  <g transform="translate(1080 118)">
    <circle r="66" stroke="#b7ddff" stroke-opacity="0.16"/>
    <circle r="45" stroke="#b7ddff" stroke-opacity="0.18"/>
    <circle r="20" stroke="#b7ddff" stroke-opacity="0.16"/>
    <circle r="4" fill="#ffffff" filter="url(#softGlow)">
      <animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <circle cx="66" cy="0" r="3" fill="#9ed4ff"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="140" to="500" dur="13s" repeatCount="indefinite"/>
      <circle cx="45" cy="0" r="2.5" fill="#ffffff" opacity="0.75"/>
    </g>
  </g>

  <g opacity="0.42">
    <circle cx="980" cy="62" r="2.6" fill="#b7ddff">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="176" r="2" fill="#8dd7ff">
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1118" cy="48" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="5.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">j-hydrazine profile banner</title>
  <desc id="desc">A dark technical profile banner with grid lines, layered folder tabs on the right, and the text Hey, I'm j-hydrazine.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a111d"/>
      <stop offset="0.58" stop-color="#17263d"/>
      <stop offset="1" stop-color="#223f64"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 112) rotate(90) scale(142 240)">
      <stop offset="0" stop-color="#8dd7ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8dd7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="folderBack" x1="0" y1="0" x2="460" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#52789f"/>
      <stop offset="0.46" stop-color="#355a80"/>
      <stop offset="1" stop-color="#17283f"/>
    </linearGradient>
    <linearGradient id="folderMid" x1="0" y1="0" x2="480" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f9bc4"/>
      <stop offset="0.42" stop-color="#426b95"/>
      <stop offset="1" stop-color="#1d344f"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="520" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9bc7ec"/>
      <stop offset="0.34" stop-color="#6f9bc4"/>
      <stop offset="1" stop-color="#2b4c70"/>
    </linearGradient>
    <linearGradient id="folderSheen" x1="60" y1="0" x2="500" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="folderEdge" x1="0" y1="0" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#06101f" stop-opacity="0.22"/>
    </linearGradient>
    <pattern id="grid" width="120" height="80" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V80" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="folderTexture" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 6H18M0 15H18" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
      <path d="M4 0V18M14 0V18" stroke="#081424" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="folderShadow" x="-20%" y="-30%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="-10" dy="18" stdDeviation="14" flood-color="#020713" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#b7ddff" flood-opacity="0.16"/>
    </filter>
    <filter id="tabGlow" x="-20%" y="-40%" width="140%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="240" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="240" rx="16" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="240" rx="16" fill="url(#vignette)" opacity="0.9">
    <animate attributeName="opacity" values="0.55;0.9;0.55" dur="5s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0.9">
    <text x="68" y="58" fill="#8dd7ff" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="700" letter-spacing="4">J-HYDRAZINE / 03</text>
    <text x="68" y="126" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="45" font-weight="800">Hey, I'm j-hydrazine.</text>
    <text x="68" y="162" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Building AI tools, product systems, and useful little machines.</text>
    <text x="68" y="198" fill="#75ccff" font-family="Consolas, Monaco, monospace" font-size="12">ideas -&gt; systems -&gt; experiments -&gt; iteration</text>
  </g>

  <g transform="translate(1110 32) rotate(90) scale(0.39)" filter="url(#folderShadow)">
    <path d="M54 20C54 10 62 4 72 4H190C205 4 212 14 218 26L226 42H424C439 42 450 53 450 68V104H20V54C20 35 35 20 54 20Z" fill="url(#folderBack)" opacity="0.64"/>
    <path d="M20 78H450V130C450 147 437 160 420 160H48C32 160 20 148 20 132V78Z" fill="url(#folderBack)" opacity="0.5"/>
    <path d="M54 20C54 10 62 4 72 4H190C205 4 212 14 218 26L226 42H424C439 42 450 53 450 68V104H20V54C20 35 35 20 54 20Z" fill="url(#folderTexture)" opacity="0.55"/>
    <path d="M28 83H440" stroke="url(#folderEdge)" stroke-width="2" opacity="0.65"/>

    <g transform="translate(-24 34)">
      <path d="M54 22C54 12 62 6 72 6H212C227 6 235 16 241 29L250 48H456C472 48 484 60 484 76V122H14V58C14 38 31 22 54 22Z" fill="url(#folderMid)" opacity="0.82"/>
      <path d="M14 90H484V154C484 172 470 186 452 186H48C28 186 14 172 14 154V90Z" fill="url(#folderMid)" opacity="0.72"/>
      <path d="M54 22C54 12 62 6 72 6H212C227 6 235 16 241 29L250 48H456C472 48 484 60 484 76V122H14V58C14 38 31 22 54 22Z" fill="url(#folderTexture)" opacity="0.5"/>
      <path d="M30 95H468" stroke="url(#folderEdge)" stroke-width="2" opacity="0.68"/>
    </g>

    <g transform="translate(18 82)">
      <path d="M62 18C62 8 70 2 80 2H224C239 2 248 12 254 26L264 48H482C498 48 510 60 510 76V138H14V62C14 38 34 18 62 18Z" fill="url(#folderFront)"/>
      <path d="M14 102H510V142C510 162 494 178 474 178H50C30 178 14 162 14 142V102Z" fill="url(#folderFront)"/>
      <path d="M62 18C62 8 70 2 80 2H224C239 2 248 12 254 26L264 48H482C498 48 510 60 510 76V138H14V62C14 38 34 18 62 18Z" fill="url(#folderSheen)"/>
      <path d="M14 102H510V142C510 162 494 178 474 178H50C30 178 14 162 14 142V102Z" fill="url(#folderTexture)" opacity="0.42"/>
      <path d="M32 106H494" stroke="url(#folderEdge)" stroke-width="2" opacity="0.72"/>
      <rect x="84" y="98" width="128" height="34" rx="9" fill="#0b111c" opacity="0.8"/>
      <text x="107" y="121" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">this. works</text>
    </g>

    <g opacity="0.42" filter="url(#tabGlow)">
      <rect x="80" y="24" width="128" height="6" rx="3" fill="#b7ddff"/>
      <rect x="222" y="74" width="150" height="6" rx="3" fill="#b7ddff"/>
      <rect x="360" y="134" width="104" height="6" rx="3" fill="#b7ddff"/>
    </g>
  </g>
</svg>

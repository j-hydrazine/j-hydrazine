name: Generate contribution snake

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate monochrome contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: j-hydrazine
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#262626&color_dots=#ededed,#b0b0b0,#999999,#666666,#333333
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f5f5f5&color_dots=#2b292c,#515151,#808080,#b6b6b6,#eeeeee

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
